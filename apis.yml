aid: sfcompute
url: https://raw.githubusercontent.com/api-evangelist/sfcompute/refs/heads/main/apis.yml
name: SF Compute
kind: company
description: SF Compute (San Francisco Compute Company) runs a spot-priced market for very large scale
  GPU clusters. The api.sfcompute.com REST API lets buyers and sellers place market orders for blocks
  of H100 GPU-hours, manage tradable cluster contracts, query live market prices, check balances, and
  provision managed Kubernetes clusters, nodes, and VMs - all driven by the `sf` CLI and language SDKs.
